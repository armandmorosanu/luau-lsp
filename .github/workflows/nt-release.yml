# Fork-only: builds and publishes release binaries for tags like 1.70.1-nt.1.
name: NT Release

on:
  push:
    tags: ["*-nt.*"]

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Fork build of luau-lsp with the nt/solver-perf changes (parallel analyze via LUAU_LSP_JOBS, new solver speedups, mimalloc). Not reviewed upstream."

  dist:
    needs: ["create-release"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: luau-lsp-win64
          - os: ubuntu-22.04
            artifact-name: luau-lsp-linux-x86_64
          - os: ubuntu-22.04-arm
            artifact-name: luau-lsp-linux-arm64
          - os: macos-latest
            artifact-name: luau-lsp-macos

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Server
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLSP_STATIC_CRT:BOOL=ON -DLSP_BUILD_WITH_SENTRY:BOOL=OFF -DLSP_MIMALLOC:BOOL=ON
          cmake --build . --config RelWithDebInfo --target Luau.LanguageServer.CLI -j 3

      - name: (MacOS) Verify universal build
        if: matrix.os == 'macos-latest'
        run: lipo -archs build/luau-lsp

      - name: Create Release Archive
        shell: bash
        run: |
          mkdir staging dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/RelWithDebInfo/luau-lsp.exe staging/
            cd staging
            7z a ../dist/server.zip *
          else
            cp build/luau-lsp staging/
            cd staging
            zip ../dist/server.zip *
          fi

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp dist/server.zip "${{ matrix.artifact-name }}.zip"
          gh release upload "${{ github.ref_name }}" "${{ matrix.artifact-name }}.zip" --repo "${{ github.repository }}"
